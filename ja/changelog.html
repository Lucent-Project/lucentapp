<!DOCTYPE html>
<html lang="ja">
<head>
<script>(function(){try{var K='lucent-lang',p=location.pathname;var m=/\/(zh|ja|ko)(\/|$)/.exec(p);var cur=m?m[1]:'en';var s=null;try{s=localStorage.getItem(K)}catch(e){}var base=p.replace(/\/(zh|ja|ko)(\/|$)/,'$2');if(s&&s!==cur){var np=s==='en'?base:base.replace(/\/([^\/]*)$/,'/'+s+'/$1');location.replace(np+location.search+location.hash);return}if(s||m){if(m){try{localStorage.setItem(K,m[1])}catch(e){}}return}var l=(navigator.language||navigator.userLanguage||'en').toLowerCase();var t=l.indexOf('zh')===0?'zh':l.indexOf('ja')===0?'ja':l.indexOf('ko')===0?'ko':'en';if(t==='en')return;location.replace(p.replace(/\/([^\/]*)$/,'/'+t+'/$1')+location.search+location.hash)}catch(e){}})();</script>
