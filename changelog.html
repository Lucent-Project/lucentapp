<script>(function(){try{var K='lucent-lang';if(localStorage.getItem(K))return;var p=location.pathname;var m=/\/(zh|ja|ko)(\/|$)/.exec(p);if(m){try{localStorage.setItem(K,m[1])}catch(e){}return}var l=(navigator.language||navigator.userLanguage||'en').toLowerCase();var t=l.indexOf('zh')===0?'zh':l.indexOf('ja')===0?'ja':l.indexOf('ko')===0?'ko':'en';if(t==='en')return;location.replace(p.replace(/\/([^\/]*)$/,'/'+t+'/$1')+location.search+location.hash)}catch(e){}})();</script>
