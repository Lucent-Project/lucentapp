name: Mirror Preview Release

'on':
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: mirror-preview-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync latest preview release
        id: sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          REPO="Lucent-Project/Lucent"

          echo "Fetching releases from $REPO..."
          AUTH_HEADER=()
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            AUTH_HEADER=(-H "Authorization: Bearer $GITHUB_TOKEN")
          fi

          HTTP_CODE=$(curl -sSL -o /tmp/rel_list.json -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            "${AUTH_HEADER[@]}" \
            "https://api.github.com/repos/$REPO/releases?per_page=20" || true)

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Failed to fetch releases (HTTP $HTTP_CODE). Exiting."
            exit 0
          fi

          RELEASE_JSON=$(jq -c '
            [.[] | select(.prerelease == true and .draft != true) |
             select(([.assets[]? | select(.name | test("\\.apk$"))] | length > 0) or
                    ([.assets[]? | select(.name | test("\\.exe$"))] | length > 0))] | first // empty
          ' /tmp/rel_list.json)

          if [ -z "$RELEASE_JSON" ] || [ "$RELEASE_JSON" = "null" ]; then
            echo "No preview release with APK or EXE assets found. Exiting."
            exit 0
          fi

          TAG_NAME=$(echo "$RELEASE_JSON" | jq -r '.tag_name')

          if [ -f "downloads/preview-version.json" ]; then
            CURR_TAG=$(jq -r '.tag_name // empty' downloads/preview-version.json)
            if [ "$CURR_TAG" = "$TAG_NAME" ]; then
              echo "Preview $TAG_NAME is already mirrored. Nothing to do."
              exit 0
            fi
          fi

          echo "Found new preview release: $TAG_NAME"

          mkdir -p downloads
          echo "$RELEASE_JSON" | jq '{
            tag_name: .tag_name,
            name: .name,
            body: .body,
            html_url: .html_url,
            published_at: .published_at,
            prerelease: .prerelease,
            draft: .draft,
            assets: [.assets[]? | {
              name: .name,
              browser_download_url: .browser_download_url,
              size: .size
            }]
          }' > downloads/preview-version.json

          echo "Successfully wrote downloads/preview-version.json"

          if [ -n "${GITHUB_OUTPUT:-}" ]; then
            echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
            echo "synced=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push synced file
        if: steps.sync.outputs.synced == 'true'
        run: |
          git config user.name "Yuan0-o"
          git config user.email "yuan47578@gmail.com"
          git add downloads/preview-version.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(mirror): sync preview release ${{ steps.sync.outputs.tag_name }}"
            git pull --rebase origin main || true
            git push origin main
          fi
