name: Mirror Stable Release

'on':
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: mirror-stable-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync latest stable release
        id: sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          REPOS=("Lucent-Project/lucentapp" "Lucent-Project/Lucent")

          echo "Searching for latest stable release..."
          RELEASE_JSON=""
          SELECTED_REPO=""

          for REPO in "${REPOS[@]}"; do
            echo "Checking repo: $REPO"
            AUTH_HEADER=()
            if [ -n "${GITHUB_TOKEN:-}" ]; then
              AUTH_HEADER=(-H "Authorization: Bearer $GITHUB_TOKEN")
            fi

            # Check /releases/latest first
            HTTP_CODE=$(curl -sSL -o /tmp/rel.json -w "%{http_code}" \
              -H "Accept: application/vnd.github+json" \
              "${AUTH_HEADER[@]}" \
              "https://api.github.com/repos/$REPO/releases/latest" || true)

            if [ "$HTTP_CODE" = "200" ]; then
              IS_PRE=$(jq -r '.prerelease' /tmp/rel.json)
              IS_DRAFT=$(jq -r '.draft' /tmp/rel.json)
              TAG=$(jq -r '.tag_name // empty' /tmp/rel.json)
              if [ "$IS_PRE" = "false" ] && [ "$IS_DRAFT" = "false" ] && [ -n "$TAG" ]; then
                HAS_APK=$(jq -r '[.assets[] | select(.name | test("\\.apk$") and (test("\\.sha256$") | not))] | length' /tmp/rel.json)
                HAS_EXE=$(jq -r '[.assets[] | select(.name | test("\\.exe$") and (test("\\.sha256$") | not))] | length' /tmp/rel.json)
                if [ "$HAS_APK" -gt 0 ] && [ "$HAS_EXE" -gt 0 ]; then
                  RELEASE_JSON=$(cat /tmp/rel.json)
                  SELECTED_REPO="$REPO"
                  break
                fi
              fi
            fi

            # Check recent releases list if /latest did not match
            HTTP_CODE=$(curl -sSL -o /tmp/rel_list.json -w "%{http_code}" \
              -H "Accept: application/vnd.github+json" \
              "${AUTH_HEADER[@]}" \
              "https://api.github.com/repos/$REPO/releases?per_page=100" || true)

            if [ "$HTTP_CODE" = "200" ]; then
              MATCH=$(jq -c '
                [.[] | select(.prerelease == false and .draft == false) |
                 select(([.assets[] | select(.name | test("\\.apk$") and (test("\\.sha256$") | not))] | length > 0) and
                        ([.assets[] | select(.name | test("\\.exe$") and (test("\\.sha256$") | not))] | length > 0))] | first // empty
              ' /tmp/rel_list.json)
              if [ -n "$MATCH" ] && [ "$MATCH" != "null" ]; then
                RELEASE_JSON="$MATCH"
                SELECTED_REPO="$REPO"
                break
              fi
            fi
          done

          if [ -z "$RELEASE_JSON" ] || [ "$RELEASE_JSON" = "null" ]; then
            echo "No stable release with both APK and EXE assets found. Exiting."
            exit 0
          fi

          TAG_NAME=$(echo "$RELEASE_JSON" | jq -r '.tag_name')
          VERSION=$(echo "$TAG_NAME" | sed 's/^[vV]//')
          HTML_URL=$(echo "$RELEASE_JSON" | jq -r '.html_url // ""')
          PUBLISHED_AT=$(echo "$RELEASE_JSON" | jq -r '.published_at // ""')
          REL_BODY=$(echo "$RELEASE_JSON" | jq -r '.body // ""')
          REL_NAME=$(echo "$RELEASE_JSON" | jq -r '.name // ""')

          APK_NAME=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | test("\\.apk$") and (test("\\.sha256$") | not)) | .name' | head -n 1)
          APK_URL=$(echo "$RELEASE_JSON" | jq -r --arg n "$APK_NAME" '.assets[] | select(.name == $n) | .browser_download_url' | head -n 1)

          EXE_NAME=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | test("\\.exe$") and (test("\\.sha256$") | not)) | .name' | head -n 1)
          EXE_URL=$(echo "$RELEASE_JSON" | jq -r --arg n "$EXE_NAME" '.assets[] | select(.name == $n) | .browser_download_url' | head -n 1)

          echo "Found stable release: $TAG_NAME ($VERSION) from $SELECTED_REPO"
          echo "APK asset: $APK_NAME"
          echo "EXE asset: $EXE_NAME"

          SPLIT_THRESHOLD=99614720

          if [ -f "downloads/version.json" ]; then
            CURR_TAG=$(jq -r '.tag_name // empty' downloads/version.json)
            if [ "$CURR_TAG" = "$TAG_NAME" ]; then
              ALL_VERIFIED=true
              ASSET_COUNT=$(jq '.assets | length' downloads/version.json 2>/dev/null || echo 0)
              if [ "$ASSET_COUNT" -eq 0 ]; then
                ALL_VERIFIED=false
              fi
              for ((i=0; i<ASSET_COUNT; i++)); do
                ASSET_NAME=$(jq -r ".assets[$i].name" downloads/version.json)
                HAS_SPLIT=$(jq -r ".assets[$i].split != null" downloads/version.json)
                if [ "$HAS_SPLIT" = "true" ]; then
                  PART_COUNT=$(jq ".assets[$i].split.parts | length" downloads/version.json 2>/dev/null || echo 0)
                  if [ "$PART_COUNT" -eq 0 ]; then
                    ALL_VERIFIED=false
                    break
                  fi
                  for ((j=0; j<PART_COUNT; j++)); do
                    PART_NAME=$(jq -r ".assets[$i].split.parts[$j].name" downloads/version.json)
                    EXP_SHA=$(jq -r ".assets[$i].split.parts[$j].sha256" downloads/version.json)
                    if [ ! -f "downloads/$PART_NAME" ]; then
                      ALL_VERIFIED=false
                      break 2
                    fi
                    ACT_SHA=$(sha256sum "downloads/$PART_NAME" | cut -d' ' -f1)
                    if [ "$ACT_SHA" != "$EXP_SHA" ]; then
                      ALL_VERIFIED=false
                      break 2
                    fi
                  done
                else
                  EXP_SHA=$(jq -r ".assets[$i].sha256 // empty" downloads/version.json)
                  if [ ! -f "downloads/$ASSET_NAME" ]; then
                    ALL_VERIFIED=false
                    break
                  fi
                  ACT_SHA=$(sha256sum "downloads/$ASSET_NAME" | cut -d' ' -f1)
                  if [ "$ACT_SHA" != "$EXP_SHA" ]; then
                    ALL_VERIFIED=false
                    break
                  fi
                fi
              done
              if [ "$ALL_VERIFIED" = "true" ]; then
                echo "Release $TAG_NAME is already mirrored and verified in downloads/. Nothing to do."
                exit 0
              fi
            fi
          fi

          STAGE_DIR="downloads_staging_$$"
          mkdir -p "$STAGE_DIR"
          trap 'rm -rf "$STAGE_DIR"' EXIT

          echo "Downloading APK from $APK_URL..."
          curl -fL --retry 3 --retry-delay 2 ${GITHUB_TOKEN:+-H "Authorization: Bearer $GITHUB_TOKEN"} -o "$STAGE_DIR/$APK_NAME" "$APK_URL"

          echo "Downloading EXE from $EXE_URL..."
          curl -fL --retry 3 --retry-delay 2 ${GITHUB_TOKEN:+-H "Authorization: Bearer $GITHUB_TOKEN"} -o "$STAGE_DIR/$EXE_NAME" "$EXE_URL"

          process_asset() {
            local FILE_NAME="$1"
            local PLATFORM="$2"
            local DL_URL="$3"
            local FILE_PATH="$STAGE_DIR/$FILE_NAME"

            local FILE_SIZE
            FILE_SIZE=$(stat -c %s "$FILE_PATH")
            if [ "$FILE_SIZE" -le 0 ]; then
              echo "::error::SAFETY CHECK FAILED: Downloaded file is empty! $FILE_NAME: $FILE_SIZE bytes. Aborting sync."
              exit 1
            fi

            local WHOLE_SHA256
            WHOLE_SHA256=$(sha256sum "$FILE_PATH" | cut -d' ' -f1)

            if [ "$FILE_SIZE" -gt "$SPLIT_THRESHOLD" ]; then
              split -b 95M "$FILE_PATH" "$FILE_PATH.part"
              rm -f "$FILE_PATH"

              local PARTS_JSON="[]"
              for PART in $(ls -1 "$FILE_PATH.part"* | LC_ALL=C sort); do
                local PNAME
                PNAME=$(basename "$PART")
                local PSIZE
                PSIZE=$(stat -c %s "$PART")
                if [ "$PSIZE" -le 0 ] || [ "$PSIZE" -gt 104857600 ]; then
                  echo "::error::SAFETY CHECK FAILED: Invalid part size for $PNAME: $PSIZE bytes. Aborting sync."
                  exit 1
                fi
                local PSHA
                PSHA=$(sha256sum "$PART" | cut -d' ' -f1)
                local PURL="https://lucent-project.github.io/lucentapp/downloads/$PNAME"
                PARTS_JSON=$(jq -c --arg n "$PNAME" --argjson s "$PSIZE" --arg h "$PSHA" --arg u "$PURL" \
                  '. + [{name: $n, size: $s, sha256: $h, url: $u}]' <<< "$PARTS_JSON")
              done

              ASSET_ENTRY=$(jq -n \
                --arg name "$FILE_NAME" \
                --arg ver "$VERSION" \
                --arg platform "$PLATFORM" \
                --argjson size "$FILE_SIZE" \
                --arg sha256 "$WHOLE_SHA256" \
                --arg fallback "$DL_URL" \
                --argjson parts "$PARTS_JSON" \
                '{
                  name: $name,
                  version: $ver,
                  platform: $platform,
                  size: $size,
                  sha256: $sha256,
                  fallback_download_url: $fallback,
                  split: {
                    parts: $parts
                  }
                }')

              FILE_ENTRY=$(jq -n \
                --arg name "$FILE_NAME" \
                --arg ver "$VERSION" \
                --arg platform "$PLATFORM" \
                --argjson size "$FILE_SIZE" \
                --arg sha256 "$WHOLE_SHA256" \
                --arg fallback "$DL_URL" \
                --argjson parts "$PARTS_JSON" \
                '{
                  name: $name,
                  version: $ver,
                  platform: $platform,
                  size: $size,
                  sha256: $sha256,
                  fallback_download_url: $fallback,
                  split: {
                    parts: $parts
                  }
                }')
            else
              local MIRROR_URL="https://lucent-project.github.io/lucentapp/downloads/$FILE_NAME"
              ASSET_ENTRY=$(jq -n \
                --arg name "$FILE_NAME" \
                --arg ver "$VERSION" \
                --arg platform "$PLATFORM" \
                --argjson size "$FILE_SIZE" \
                --arg sha256 "$WHOLE_SHA256" \
                --arg mirror "$MIRROR_URL" \
                --arg fallback "$DL_URL" \
                '{
                  name: $name,
                  version: $ver,
                  platform: $platform,
                  size: $size,
                  sha256: $sha256,
                  browser_download_url: $mirror,
                  fallback_download_url: $fallback
                }')

              FILE_ENTRY=$(jq -n \
                --arg name "$FILE_NAME" \
                --arg ver "$VERSION" \
                --arg platform "$PLATFORM" \
                --argjson size "$FILE_SIZE" \
                --arg sha256 "$WHOLE_SHA256" \
                --arg mirror "$MIRROR_URL" \
                '{
                  name: $name,
                  version: $ver,
                  platform: $platform,
                  size: $size,
                  sha256: $sha256,
                  url: $mirror
                }')
            fi
          }

          process_asset "$APK_NAME" "android" "$APK_URL"
          APK_ASSET="$ASSET_ENTRY"
          APK_FILE="$FILE_ENTRY"

          process_asset "$EXE_NAME" "windows" "$EXE_URL"
          EXE_ASSET="$ASSET_ENTRY"
          EXE_FILE="$FILE_ENTRY"

          mkdir -p downloads
          rm -f downloads/*.apk downloads/*.exe downloads/*.part*

          mv "$STAGE_DIR"/* downloads/
          rm -rf "$STAGE_DIR"
          trap - EXIT

          jq -n \
            --arg tag "$TAG_NAME" \
            --arg ver "$VERSION" \
            --arg name "$REL_NAME" \
            --arg html_url "$HTML_URL" \
            --arg pub "$PUBLISHED_AT" \
            --arg body "$REL_BODY" \
            --argjson apk_asset "$APK_ASSET" \
            --argjson exe_asset "$EXE_ASSET" \
            --argjson apk_file "$APK_FILE" \
            --argjson exe_file "$EXE_FILE" \
            '{
              tag_name: $tag,
              version: $ver,
              name: $name,
              html_url: $html_url,
              published_at: $pub,
              body: $body,
              assets: [$apk_asset, $exe_asset],
              files: [$apk_file, $exe_file]
            }' > downloads/version.json

          echo "Successfully wrote downloads/version.json"

          if [ -n "${GITHUB_OUTPUT:-}" ]; then
            echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
            echo "synced=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push synced files
        if: steps.sync.outputs.synced == 'true'
        run: |
          git config user.name "Yuan0-o"
          git config user.email "yuan47578@gmail.com"
          git add -A downloads/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(mirror): sync stable release ${{ steps.sync.outputs.tag_name }}"
            git pull --rebase origin main || true
            git push origin main
          fi
